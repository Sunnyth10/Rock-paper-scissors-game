<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper scissors</title>
    <link rel="stylesheet" href="stonepprscissors.css">
</head>
<body>
    <h1>Rock paper scissors</h1>
       <div class="choice">
            <button id="rock"></button>
            <button id="paper"></button>
            <button id="scissors"></button>
        </div>

         <div class="result">
            <h2>Result</h2>
            <p id="result-text">Make your choice!</p>
        </div>

        <div class="reset">
            <button id="reset">Reset</button>
        </div>
        <div class="scoreboard">
            <h2>Scoreboard</h2>
            <p id="noofmatches">Number of matches: 0</p>
            <p id="user-score">User Score: 0</p>
            <p id="computer-score">Computer Score: 0</p>
        </div>
       
    </div>
    <script src="stonepprscissors.js"></script>

</body>
</html>
